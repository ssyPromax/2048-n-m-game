name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add compiler to PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Build exe
        run: g++ -O2 -static -mwindows -o "2048(n*m).exe" "2048(n*m).cpp" -lcomctl32

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: 2048 (n*m) v1.0
          body: |
            n*m 的 2048 小游戏，Windows 可执行文件（Actions 自动构建）
            - 2048(n*m).exe：图形界面版
          files: |
            "2048(n*m).exe"
