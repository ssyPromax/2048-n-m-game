name: 2048n_m Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add compiler to PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Build exe
        run: g++ -O2 -static -mwindows -o 2048n_m.exe 2048n_m.cpp -lcomctl32

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: 2048n_m v1.0
          files: 2048n_m.exe

  apk:
    needs: exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -sL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: cd android && bash build-apk.sh 2048n_m.apk
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: android/2048n_m.apk
